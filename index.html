<style>
  .font-cinzel { font-family: 'Cinzel', Georgia, serif; }
  .font-inter { font-family: 'Inter', system-ui, sans-serif; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', system-ui, sans-serif; background-color: #F4F7F6; overflow-x: hidden; color: #1A1A1A; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #F4F7F6; }
  ::-webkit-scrollbar-thumb { background: #002D62; border-radius: 4px; }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .faq-chevron { transform: rotate(180deg); }
  .btn { display: inline-flex; align-items: center; justify-content: center; }

  /* ---- Página inmersiva de comité ---- */
  .cd-reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1); }
  .cd-reveal.cd-visible { opacity: 1; transform: translateY(0); }
  .cd-hero-bg { transition: transform 0.15s linear; will-change: transform; }
  .cd-hero-fade { transition: opacity 0.2s linear, transform 0.2s linear; }
  .cd-scrolldown { animation: cdBounce 1.8s ease-in-out infinite; }
  @keyframes cdBounce { 0%,100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(8px); opacity: 0.5; } }
  .cd-floatnav a { position: relative; }
  .cd-floatnav a.cd-active { color: #FFD15C !important; }
  .cd-floatnav a.cd-active::after { content:''; position:absolute; left:0; right:0; bottom:-6px; height:2px; background:#FFD15C; }
  .cd-tag { transition: transform 0.25s ease, background-color 0.25s ease; }
  .cd-tag:hover { transform: translateY(-4px); }
  .cd-triad-btn.cd-triad-active { background:#002D62; color:#fff; }
  .cd-timeline-dot { transition: transform 0.2s ease, background-color 0.2s ease; }
  .cd-timeline-item.cd-tl-active .cd-timeline-dot { background:#FFD15C; transform: scale(1.3); }
  .cd-check-item.cd-checked .cd-check-box { background:#002D62; border-color:#002D62; }
  .cd-check-item.cd-checked .cd-check-label { text-decoration: line-through; opacity: 0.55; }
  .cd-country-chip { transition: background-color 0.2s ease, transform 0.2s ease; }
  .cd-country-chip:hover { transform: translateY(-2px); }

  /* ---- Sección "El Tema" con imagen temática ---- */
  .cd-tema-figure img { transition: transform 1.4s cubic-bezier(0.16,1,0.3,1); }
  .cd-tema-figure:hover img { transform: scale(1.035); }
  .cd-tema-cinema .cd-triad-btn.cd-triad-active { background:#FFD15C; color:#002D62; border-color:#FFD15C; }
  .cd-tema-cinema .cd-triad-explain { transition: opacity 0.25s ease; }

  /* ---- Academia del Delegado ---- */
  .ac-reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); }
  .ac-reveal.ac-visible { opacity: 1; transform: translateY(0); }
  .ac-tab-btn.ac-tab-active { background:#002D62 !important; color:#fff !important; border-color:#002D62 !important; }
  .ac-flip-card { perspective: 1200px; cursor: pointer; }
  .ac-flip-inner { transition: transform 0.6s cubic-bezier(0.4,0.2,0.2,1); transform-style: preserve-3d; }
  .ac-flip-card.ac-flipped .ac-flip-inner { transform: rotateY(180deg); }
  .ac-flip-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .ac-flip-back { transform: rotateY(180deg); }
  .ac-quiz-opt.ac-correct { background:#e8f7ee !important; border-color:#22c55e !important; }
  .ac-quiz-opt.ac-wrong { background:#fdecec !important; border-color:#ef4444 !important; }
</style>

/* Cuenta inscripciones activas (no rechazadas) por comité, para calcular cupos disponibles. */
function committeeCounts() {
  const counts = {};
  COMMITTEES.forEach(c => { counts[c.id] = 0; });
  (S.admin.rows || []).forEach(r => {
    if (r.status !== 'Rechazado' && counts.hasOwnProperty(r.committee_id)) counts[r.committee_id]++;
  });
  return counts;
}

function committeeSlotsInfo(id) {
  const used = committeeCounts()[id] || 0;
  const remaining = Math.max(0, COMMITTEE_CAPACITY - used);
  return { used: used, remaining: remaining, full: remaining <= 0 };
}

/* ---------- 4. UTILIDADES ---------- */

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function icon(name, cls) {
  return '<i data-lucide="' + name + '" class="' + (cls || 'w-5 h-5') + '"></i>';
}

function committeeById(id) { return COMMITTEES.find(c => c.id === id) || null; }
function committeeName(id) { const c = committeeById(id); return c ? c.name : 'N/A'; }

function isCommitteeRoute(route) {
  return typeof route === 'string' && route.indexOf('comite-') === 0 && !!committeeById(route.slice(7));
}

function getRouteFromHash() {
  const hash = window.location.hash.replace(/^#/, '');
  if (isCommitteeRoute(hash)) return hash;
  return ROUTES.indexOf(hash) !== -1 ? hash : 'home';
}

function navigateTo(route) {
  S.route = route;
  S.menuOpen = false;
  const target = route === 'home' ? '' : route;
  if (window.location.hash.replace(/^#/, '') !== target) {
    window.location.hash = target;
  } else {
    render();
  }
  window.scrollTo(0, 0);
}

function scrollToSection(id) {
  const go = () => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); };
  if (S.route !== 'home') { navigateTo('home'); setTimeout(go, 150); }
  else { S.menuOpen = false; render(); go(); }
}

let cdScrollHandler = null;
let cdObserver = null;

function stopCommitteeDetailEffects() {
  if (cdScrollHandler) { window.removeEventListener('scroll', cdScrollHandler); cdScrollHandler = null; }
  if (cdObserver) { cdObserver.disconnect(); cdObserver = null; }
}

function initCommitteeDetailPage() {
  stopCommitteeDetailEffects();

  cdObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('cd-visible'); cdObserver.unobserve(entry.target); }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.cd-reveal').forEach(el => cdObserver.observe(el));

  const heroBg = document.querySelector('.cd-hero-bg');
  const heroFade = document.querySelector('.cd-hero-fade');
  const scrollInd = document.querySelector('.cd-scrolldown');
  const navLinks = Array.prototype.slice.call(document.querySelectorAll('.cd-floatnav a'));
  const sections = navLinks.map(a => document.getElementById(a.getAttribute('data-target')));

  let ticking = false;
  cdScrollHandler = function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      if (heroBg) heroBg.style.transform = 'translateY(' + (y * 0.22) + 'px) scale(1.08)';
      if (heroFade) {
        const op = Math.max(0, 1 - y / 480);
        heroFade.style.opacity = String(op);
        heroFade.style.transform = 'translateY(' + (y * 0.12) + 'px)';
      }
      if (scrollInd) scrollInd.style.opacity = y > 120 ? '0' : '1';
      let currentIdx = -1;
      sections.forEach((sec, i) => { if (sec && sec.getBoundingClientRect().top < 160) currentIdx = i; });
      navLinks.forEach((a, i) => a.classList.toggle('cd-active', i === currentIdx));
      ticking = false;
    });
  };
  window.addEventListener('scroll', cdScrollHandler, { passive: true });
  cdScrollHandler();
}

function cdScrollTo(targetId) {
  const el = document.getElementById(targetId);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleTriad(el) {
  const group = el.closest('.theme-triad');
  if (!group) return;
  group.querySelectorAll('.cd-triad-btn').forEach(b => b.classList.remove('cd-triad-active'));
  el.classList.add('cd-triad-active');
  const explain = group.querySelector('.cd-triad-explain');
  if (explain) explain.textContent = el.getAttribute('data-text') || '';
}

function toggleTimeline(el) {
  const item = el.closest('.cd-timeline-item');
  if (!item) return;
  item.classList.toggle('cd-tl-active');
  const txt = item.querySelector('.cd-tl-text');
  if (txt) txt.classList.toggle('hidden');
}

function toggleCountries(el) {
  const section = el.closest('.cd-countries-section');
  if (!section) return;
  const extras = section.querySelectorAll('.cd-country-extra');
  if (!extras.length) return;
  const isHiddenNow = extras[0].classList.contains('hidden');
  extras.forEach(c => c.classList.toggle('hidden', !isHiddenNow));
  el.textContent = isHiddenNow ? 'Ver menos ↑' : 'Ver todas las delegaciones →';
}

/* ---- Interactividad de la Academia (sin necesidad de re-render completo) ---- */

function selectAcModule(id) {
  document.querySelectorAll('.ac-module-panel').forEach(function (p) { p.classList.toggle('hidden', p.getAttribute('data-module') !== id); });
  document.querySelectorAll('.ac-tab-btn[data-module]').forEach(function (b) { b.classList.toggle('ac-tab-active', b.getAttribute('data-module') === id); });
}

let acObserver = null;
function stopAcademiaEffects() {
  if (acObserver) { acObserver.disconnect(); acObserver = null; }
}
function initAcademiaEffects() {
  stopAcademiaEffects();
  acObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) { entry.target.classList.add('ac-visible'); acObserver.unobserve(entry.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.ac-reveal').forEach(function (el) { acObserver.observe(el); });
}

function acQuizPick(el) {
  const caseBox = el.closest('.ac-quiz-case');
  if (!caseBox) return;
  caseBox.querySelectorAll('.ac-quiz-opt').forEach(function (o) { o.classList.remove('ac-correct', 'ac-wrong'); });
  const correct = el.getAttribute('data-correct') === 'true';
  el.classList.add(correct ? 'ac-correct' : 'ac-wrong');
  const fb = caseBox.querySelector('.ac-quiz-feedback');
  if (fb) {
    fb.innerHTML = el.getAttribute('data-feedback');
    fb.className = 'ac-quiz-feedback mt-4 p-4 rounded-xl text-sm font-inter font-medium ' + (correct ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200');
  }
}

function acSpeechOrderPick(el) {
  const container = document.getElementById('ac-speech-order');
  if (!container || el.disabled) return;
  const trail = container.querySelector('.ac-speech-trail');
  const current = (trail.getAttribute('data-order') || '').split(',').filter(Boolean);
  current.push(el.getAttribute('data-part'));
  trail.setAttribute('data-order', current.join(','));
  el.disabled = true;
  el.classList.add('opacity-40', 'cursor-not-allowed');
  const span = document.createElement('span');
  span.className = 'inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#002D62] text-white text-xs font-bold mr-2 mb-2';
  span.textContent = current.length + '. ' + el.getAttribute('data-label');
  trail.appendChild(span);
}
function acSpeechOrderCheck() {
  const container = document.getElementById('ac-speech-order');
  if (!container) return;
  const trail = container.querySelector('.ac-speech-trail');
  const order = (trail.getAttribute('data-order') || '').split(',').filter(Boolean);
  const correctOrder = ['hook', 'problema', 'soluciones', 'llamado'];
  const fb = container.querySelector('.ac-speech-feedback');
  const isCorrect = order.length === correctOrder.length && order.every(function (v, i) { return v === correctOrder[i]; });
  fb.textContent = isCorrect
    ? '¡Correcto! Ese es el orden ideal: capturas la atención, presentas el problema y tu postura, propones soluciones y cierras con un llamado a la acción.'
    : (order.length < correctOrder.length ? 'Selecciona las cuatro partes antes de comprobar el orden.' : 'Ese orden se puede mejorar. Recuerda: primero el hook, luego el problema y la postura, después las soluciones, y cierras con el llamado a la acción.');
  fb.className = 'ac-speech-feedback mt-4 p-4 rounded-xl text-sm font-inter font-medium ' + (isCorrect ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-800 border border-amber-200');
  fb.classList.remove('hidden');
}
function acSpeechOrderReset() {
  const container = document.getElementById('ac-speech-order');
  if (!container) return;
  const trail = container.querySelector('.ac-speech-trail');
  trail.setAttribute('data-order', '');
  trail.innerHTML = '';
  container.querySelectorAll('.ac-speech-btn').forEach(function (b) { b.disabled = false; b.classList.remove('opacity-40', 'cursor-not-allowed'); });
  const fb = container.querySelector('.ac-speech-feedback');
  fb.classList.add('hidden');
}

/* Guarda en el estado lo que el usuario escribió en el paso actual */
function captureStep() {
  const d = S.form.data;
  const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const school = val('school');
  if (school !== null) d.school = school;
  d.students.forEach((s, i) => {
    STUDENT_KEYS.forEach(k => { const v = val('s' + i + '_' + k); if (v !== null) s[k] = v; });
  });
  TEACHER_KEYS.forEach(k => { const v = val('t_' + k); if (v !== null) d.teacher[k] = v; });
  const motivation = val('motivation');
  if (motivation !== null) d.motivation = motivation;
  const consent = document.getElementById('consent');
  if (consent) d.consent = consent.checked;
}

function showFormError(msg) {
  S.form.error = msg;
  const box = document.getElementById('form-error');
  if (!box) return;
  box.innerHTML = msg
    ? '<div class="mb-6 p-4 bg-red-50 text-red-700 rounded-lg flex items-start gap-3 font-inter border-l-4 border-red-500" role="alert">' +
      icon('alert-circle', 'w-5 h-5 shrink-0 mt-0.5') + '<p class="text-sm font-medium">' + esc(msg) + '</p></div>'
    : '';
  refreshIcons();
}

/* Reglas de la lista de estudiantes: correos únicos y cupos suficientes por comité. */
function studentsError() {
  const students = S.form.data.students;
  const seen = {};
  for (let i = 0; i < students.length; i++) {
    const em = students[i].email.trim().toLowerCase();
    if (seen[em] !== undefined) return 'El correo del estudiante ' + (i + 1) + ' ya fue usado por el estudiante ' + (seen[em] + 1) + '. Cada estudiante debe tener un correo distinto.';
    seen[em] = i;
  }
  const counts = {};
  students.forEach(s => { counts[s.committeeId] = (counts[s.committeeId] || 0) + 1; });
  for (const id in counts) {
    const rem = committeeSlotsInfo(id).remaining;
    if (counts[id] > rem) {
      return 'El comité ' + committeeName(id) + ' solo tiene ' + rem + (rem === 1 ? ' cupo disponible' : ' cupos disponibles') + ' y seleccionaste ' + counts[id] + '. Cambia el comité de algún estudiante.';
    }
  }
  return '';
}

function validateStep() {
  const form = document.getElementById('inscription-form');
  if (!form) return false;
  if (!form.checkValidity()) {
    form.reportValidity();
    showFormError('Revisa los campos marcados antes de continuar.');
    return false;
  }
  if (S.form.step === 2) {
    const err = studentsError();
    if (err) { showFormError(err); return false; }
  }
  showFormError('');
  return true;
}

function renderStep(noScroll) {
  const body = document.getElementById('form-body');
  if (!body) return;
  body.innerHTML = stepHtml();
  document.getElementById('form-nav').innerHTML = formNavHtml();
  document.getElementById('step-num').textContent = S.form.step;
  document.getElementById('step-pct').textContent = Math.round(S.form.step / 4 * 100) + '%';
  document.getElementById('step-bar').style.width = (S.form.step / 4 * 100) + '%';
  if (S.form.step === 2) updateAddBlock();
  refreshIcons();
  if (noScroll !== true) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNext() {
  captureStep();
  if (validateStep()) { S.form.step = Math.min(4, S.form.step + 1); renderStep(); }
}

function addStudent() {
  captureStep();
  const n = S.form.data.students.length;
  if (n >= MAX_STUDENTS || !studentComplete(n - 1)) return;
  S.form.data.students.push(newStudent());
  showFormError('');
  renderStep(true);
  const first = document.getElementById('s' + n + '_firstName');
  if (first) {
    first.focus({ preventScroll: true });
    const card = first.closest('[data-student-card]');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function removeStudent(index) {
  captureStep();
  if (index < 1 || index >= S.form.data.students.length) return;
  S.form.data.students.splice(index, 1);
  showFormError('');
  renderStep(true);
}

function submitInscription() {
  captureStep();
  const d = S.form.data;
  const form = document.getElementById('inscription-form');
  if (!form.checkValidity()) { form.reportValidity(); showFormError('Revisa los campos obligatorios antes de confirmar.'); return; }
  const err = studentsError();
  if (err) { showFormError(err); return; }
  if (!d.consent) { showFormError('Debes aceptar las políticas de privacidad y uso de datos para continuar.'); return; }

  S.form.submitting = true;
  document.getElementById('form-nav').innerHTML = formNavHtml();
  refreshIcons();

  setTimeout(() => {
    try {
      const existing = getStoredInscriptions();
      const rand = () => Math.random().toString(36).substring(2, 11);
      const groupId = 'reg-' + rand();
      const createdAt = new Date().toISOString();
      const t = d.teacher;
      const newRows = d.students.map((s, i) => ({
        id: groupId + '-' + (i + 1),
        group_id: groupId,
        student_number: i + 1,
        created_at: createdAt,
        first_name: s.firstName.trim(),
        last_name: s.lastName.trim(),
        email: s.email.trim().toLowerCase(),
        phone: s.phone.trim() || null,
        grade: s.grade,
        school: d.school.trim(),
        committee_id: s.committeeId,
        teacher_name: (t.firstName.trim() + ' ' + t.lastName.trim()).trim(),
        teacher_email: t.email.trim().toLowerCase(),
        teacher_phone: t.phone.trim() || null,
        motivation: d.motivation.trim() || null,
        consent: true,
        status: 'Pendiente'
      }));
      const updatedRows = newRows.concat(existing);
      saveStoredInscriptions(updatedRows);
      S.admin.rows = updatedRows;
      S.form.submittedId = groupId;
      S.form.submittedCount = newRows.length;
      S.form.step = 5;
      S.form.submitting = false;
      render();
    } catch (e) {
      console.error(e);
      S.form.submitting = false;
      showFormError('Ocurrió un error al guardar la inscripción. Inténtalo de nuevo.');
    }
  }, 600);
}

function resetForm() {
  S.form = { step: 1, error: '', submitting: false, submittedId: '', submittedCount: 0, data: newFormData() };
}

function exportCSV() {
  const rows = filteredRows();
  if (rows.length === 0) return;
  const headers = ['ID', 'Fecha', 'Nombre', 'Apellido', 'Email', 'Telefono', 'Grado', 'Colegio', 'Comite', 'Docente asesor', 'Email docente', 'Telefono docente', 'Grupo', 'Estado'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [headers.join(',')].concat(rows.map(r => [
    q(r.id), q(new Date(r.created_at).toLocaleString()), q(r.first_name), q(r.last_name), q(r.email),
    q(r.phone || ''), q(r.grade), q(r.school), q(r.committee_id), q(r.teacher_name || ''), q(r.teacher_email || ''), q(r.teacher_phone || ''), q(r.group_id || ''), q(r.status)
  ].join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'innova_mun_inscripciones_' + new Date().toISOString().slice(0, 10) + '.csv');
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadDoc(cat, index) {
  const list = cat === 'guides' ? STUDY_GUIDES : IMPORTANT_DOCS;

  if (!doc || !doc.file) return;

}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');

  switch (act) {
    case 'nav':
      e.preventDefault();
      if (el.getAttribute('data-route') === 'inscription' && S.form.step === 5) resetForm();
      navigateTo(el.getAttribute('data-route'));
      break;

    case 'scroll':
      e.preventDefault();
      { const navKey = el.getAttribute('data-navkey'); if (navKey) S.activeNav = navKey; }
      scrollToSection(el.getAttribute('data-section'));
      break;

    case 'toggle-menu':
      S.menuOpen = !S.menuOpen;
      render();
      break;

    case 'toggle-doc-panel': {
      const key = el.getAttribute('data-panel');
      S.docPanel = S.docPanel === key ? null : key;
      render();
      if (S.docPanel === key) {
        setTimeout(() => {
          const panel = document.getElementById('doc-panel-' + key);
          if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
      }
      break;
    }

    case 'open-committee':
      navigateTo('comite-' + el.getAttribute('data-id'));
      break;

    case 'select-committee': {
      const scId = el.getAttribute('data-id');
      if (S.form.step === 5) resetForm();
      S.form.step = 1;
      /* El comité elegido queda preseleccionado para el estudiante 1 */
      S.form.data.students[0].committeeId = committeeSlotsInfo(scId).full ? '' : scId;
      S.form.submittedId = '';
      navigateTo('inscription');
      break;
    }

    case 'cd-toggle-triad':
      toggleTriad(el);
      break;

    case 'cd-toggle-timeline':
      toggleTimeline(el);
      break;

    case 'cd-toggle-check':
      el.closest('.cd-check-item').classList.toggle('cd-checked');
      break;

    case 'cd-scroll-section':
      e.preventDefault();
      cdScrollTo(el.getAttribute('data-target'));
      break;

    case 'cd-toggle-countries':
      toggleCountries(el);
      break;

    case 'ac-scroll': {
      e.preventDefault();
      const goAc = () => { const t = document.getElementById(el.getAttribute('data-target')); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      if (S.route !== 'academia') { navigateTo('academia'); setTimeout(goAc, 150); } else { goAc(); }
      break;
    }

    case 'ac-select-module':
      selectAcModule(el.getAttribute('data-module'));
      break;

    case 'ac-goto-module': {
      selectAcModule(el.getAttribute('data-module'));
      const modSection = document.getElementById('ac-modules-panel');
      if (modSection) modSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }

    case 'ac-committee-type':
      toggleTriad(el);
      break;

    case 'ac-flip-card':
      el.closest('.ac-flip-card').classList.toggle('ac-flipped');
      break;

    case 'ac-toggle-reveal': {
      const target = document.getElementById(el.getAttribute('data-target'));
      if (target) target.classList.toggle('hidden');
      break;
    }

    case 'ac-quiz-pick':
      acQuizPick(el);
      break;

    case 'ac-negotiation-pick':
      acQuizPick(el);
      break;

    case 'ac-speech-order-pick':
      acSpeechOrderPick(el);
      break;

    case 'ac-speech-order-check':
      acSpeechOrderCheck();
      break;

    case 'ac-speech-order-reset':
      acSpeechOrderReset();
      break;

    case 'add-student':
      addStudent();
      break;

    case 'remove-student':
      removeStudent(parseInt(el.getAttribute('data-index'), 10));
      break;

    case 'form-next':
      goNext();
      break;

    case 'form-prev':
      captureStep();
      showFormError('');
      S.form.step = Math.max(1, S.form.step - 1);
      renderStep();
      break;

    case 'form-reset-home':
      resetForm();
      navigateTo('home');
      break;

    case 'admin-trigger':
      if (S.isAdminLoggedIn) { S.admin.rows = getStoredInscriptions(); navigateTo('admin'); }
      else { S.showAdminLogin = true; S.adminLoginError = ''; render(); }
      break;

    case 'close-admin-login':
      S.showAdminLogin = false;
      S.adminLoginError = '';
      render();
      break;

    case 'admin-refresh':
      S.admin.rows = getStoredInscriptions();
      refreshAdminTable();
      break;

    case 'admin-logout':
      S.isAdminLoggedIn = false;
      navigateTo('home');
      break;

    case 'export-csv':
      exportCSV();
      break;

    case 'delete-row':
      deleteRegistration(el.getAttribute('data-id'));
      break;

    case 'download-doc':
      downloadDoc(el.getAttribute('data-cat'), parseInt(el.getAttribute('data-index'), 10));
      break;
  }
});

function onStudentFieldEdit(e) {
  if (S.form.step === 2 && e.target.closest && e.target.closest('#inscription-form') && e.target.hasAttribute('data-s')) updateAddBlock();
}
document.addEventListener('input', onStudentFieldEdit);
document.addEventListener('change', onStudentFieldEdit);

document.addEventListener('change', e => {
  const sel = e.target.closest('select[data-act="status"]');
  if (!sel) return;
  const id = sel.getAttribute('data-id');
  S.admin.rows = S.admin.rows.map(r => r.id === id ? Object.assign({}, r, { status: sel.value }) : r);
  saveStoredInscriptions(S.admin.rows);
  refreshAdminTable();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.showAdminLogin) { S.showAdminLogin = false; S.adminLoginError = ''; render(); }
});

window.addEventListener('hashchange', () => {
  const route = getRouteFromHash();
  if (route === 'admin' && !S.isAdminLoggedIn) { S.route = 'admin'; render(); return; }
  if (route === 'admin') S.admin.rows = getStoredInscriptions();
  S.route = route;
  S.menuOpen = false;
  render();
  window.scrollTo(0, 0);
});

/* ---------- 14. ARRANQUE ---------- */
S.route = getRouteFromHash();
if (S.route === 'admin' && !S.isAdminLoggedIn) { /* pedirá contraseña */ }
S.admin.rows = getStoredInscriptions();
render();
</script>
